name: Build and Deploy 3D Catalog

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb
          pip install -r requirements.txt

      - name: Install FreeCAD 1.x (AppImage)
        run: |
          wget -q https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
          wget -q https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage-SHA256.txt
          sha256sum -c FreeCAD_1.1.3-Linux-x86_64-py311.AppImage-SHA256.txt
          chmod +x FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
          ./FreeCAD_1.1.3-Linux-x86_64-py311.AppImage --appimage-extract >/dev/null

      - name: Run build script with Xvfb
        run: xvfb-run python build.py
        env:
          GITHUB_ACTIONS: true
          FREECAD_PYTHON_PATH: ${{ github.workspace }}/squashfs-root/usr/bin/freecadcmd

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
